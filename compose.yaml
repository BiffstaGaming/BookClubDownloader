# BookClub — Docker Compose / Portainer stack.
# Pulls the image CI publishes from GitHub Container Registry on every push to main.
# Pin a version tag instead of :latest if you prefer controlled updates (e.g. :1.2.0).
services:
  bookclub:
    image: ghcr.io/biffstagaming/bookclub:latest
    container_name: bookclub
    ports:
      - "9933:9933"
    environment:
      # Run as the same user/group as Audiobookshelf and NZBGet so the books BookClub
      # writes (and the download folders it deletes) have the right owner.
      # Leave these commented out to keep running as root, as earlier versions did.
      # - PUID=1000
      # - PGID=1000
      - UMASK=002
    volumes:
      # Database, settings and logs
      - bookclub_data:/app/data
      # NZBGet's completed downloads. In Settings, "Local Path Prefix" is /downloads and
      # "NZBGet Path Prefix" is however NZBGet sees the same folder.
      - /mnt/metadata-nvme/downloads:/downloads
      # Media share containing your Audiobookshelf library, e.g. /Media/Audiobooks.
      # Use it in Settings → Library Location Template, e.g.
      #   /Media/Audiobooks/[Author]/[Series]/[BookNumber] - [Title]/[Title].m4b
      # and map /Media/Audiobooks to the path Audiobookshelf uses for the same folder.
      - /mnt/mediaStorage:/Media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9933/api/health"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  bookclub_data:
