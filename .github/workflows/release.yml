name: Release & Publish to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1.0.0). Defaults to "latest" if omitted.'
        required: false
        default: 'latest'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Unit tests
        run: pytest -q

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local Docker engine so the image can be tested before publishing
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bookclub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — real m4b-tool/tone conversion as a non-root user
        run: |
          docker run --rm -e PUID=1000 -e PGID=1000 \
            -v "$PWD/tests:/tests:ro" bookclub:ci python /tests/smoke/run_smoke.py

      - name: Smoke test — server starts and reports healthy
        run: |
          docker run -d --name bookclub-ci -e PUID=1000 -e PGID=1000 -p 9933:9933 bookclub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9933/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:9933/ > /dev/null
          curl -fsS http://localhost:9933/api/status
          docker logs bookclub-ci
          docker rm -f bookclub-ci

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bookclub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            Pull the image from GitHub Container Registry:
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/bookclub:${{ github.ref_name }}
            ```

            ## Docker Compose

            See `compose.yaml` in the repo for a ready-to-use stack definition.
