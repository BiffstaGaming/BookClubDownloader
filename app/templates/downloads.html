{% extends "base.html" %}
{% block title %}BookClub — Downloads{% endblock %}

{% block content %}
<div class="row g-4">
  <div class="col-12">
    <h4 class="page-title mb-4">
      <i class="bi bi-download me-2 text-accent"></i>
      Download History
    </h4>
  </div>

  <!-- Requests (Home Assistant / voice, or typed here) -->
  <div class="col-12" id="requests">
    <div class="bc-card">
      <div class="bc-card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
        <span><i class="bi bi-megaphone me-2 text-accent"></i>Requests</span>
        <form class="d-flex gap-2 flex-grow-1 justify-content-end" style="max-width:520px;"
              hx-post="/downloads/requests" hx-target="#request-rows" hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) this.reset()">
          <input type="text" name="query" class="form-control form-control-sm bc-input" required minlength="2"
                 placeholder="Find and download… e.g. Project Hail Mary by Andy Weir" />
          <button type="submit" class="btn bc-btn-sm-primary text-nowrap">
            <span class="spinner-border spinner-border-sm htmx-indicator me-1" role="status"></span>
            <i class="bi bi-lightning-charge me-1"></i>Request
          </button>
        </form>
      </div>
      <div id="request-notice"></div>
      <div class="bc-card-body p-0" id="request-rows" data-bc-quiet
           hx-get="/downloads/requests" hx-trigger="load, bcRequests from:body, refreshRequests from:body, every 10s [bcShouldPoll()]" hx-swap="innerHTML">
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="bc-card">
      <div class="bc-card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
        <!-- Filter buttons -->
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <span class="text-muted small me-1">Show:</span>
          <button class="btn btn-sm dl-filter-btn active-filter" data-filter="active" onclick="setDlFilter('active')" title="In progress, failed, or waiting for you">Active</button>
          <button class="btn btn-sm dl-filter-btn" data-filter="all" onclick="setDlFilter('all')">All</button>
        </div>
        <!-- Limit selector -->
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted small">Max rows:</span>
          <select id="dl-limit-select" class="form-select form-select-sm" style="width:auto;" onchange="setDlLimit(this.value)">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="0">All</option>
          </select>
        </div>
      </div>

      <!-- Hidden control inputs included with every HTMX poll -->
      <form id="dl-controls" style="display:none;">
        <input type="hidden" id="dl-filter-input" name="dl_filter" value="active" />
        <input type="hidden" id="dl-limit-input" name="dl_limit" value="25" />
      </form>

      <div class="bc-card-body p-0">
        <div class="table-responsive">
          <table class="table bc-table mb-0">
            <thead>
              <tr>
                <th>Title</th>
                <th>Search Term</th>
                <th>NZBGet Job</th>
                <th>Status</th>
                <th>Match</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody
              id="download-rows"
              data-bc-quiet
              hx-post="/downloads/sync-status"
              hx-include="#dl-controls"
              hx-trigger="bcDownloads from:body, refreshDownloads from:body, every 10s [bcShouldPoll()]"
              hx-swap="innerHTML"
            >
              {% include "partials/download_rows.html" %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Convert to M4B panel — populated by HTMX when Convert button is clicked -->
  <div class="col-12" id="convert-panel" data-bc-clear-when-empty></div>
</div>
{% endblock %}

{% block extra_js %}
<style>
.dl-filter-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 5px;
  padding: 0.2rem 0.6rem;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: background 0.15s, color 0.15s;
}
.dl-filter-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
.dl-filter-btn.active-filter { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
<script>
// Filter and row count are remembered between visits.
var highlightId = new URLSearchParams(location.search).get('highlight');

function reloadRows() {
  // `source` matters: without it htmx treats <body> as the requester and every
  // loading spinner on the page lights up.
  htmx.ajax('POST', '/downloads/sync-status', {
    source: '#download-rows',
    target: '#download-rows',
    swap: 'innerHTML',
    values: { dl_filter: document.getElementById('dl-filter-input').value,
              dl_limit: document.getElementById('dl-limit-input').value }
  });
}
function applyDlControls(filter, limit) {
  document.getElementById('dl-filter-input').value = filter;
  document.getElementById('dl-limit-input').value = limit;
  document.getElementById('dl-limit-select').value = limit;
  document.querySelectorAll('.dl-filter-btn').forEach(function(btn) {
    btn.classList.toggle('active-filter', btn.dataset.filter === filter);
  });
}
function setDlFilter(f) {
  applyDlControls(f, document.getElementById('dl-limit-input').value);
  bcStore.set('downloads', { filter: f, limit: document.getElementById('dl-limit-input').value });
  reloadRows();
}
function setDlLimit(l) {
  applyDlControls(document.getElementById('dl-filter-input').value, l);
  bcStore.set('downloads', { filter: document.getElementById('dl-filter-input').value, limit: l });
  reloadRows();
}

(function () {
  var saved = bcStore.get('downloads', { filter: 'active', limit: '25' });
  // A notification link to a finished book: show everything so the row is there.
  applyDlControls(highlightId ? 'all' : saved.filter, highlightId ? '50' : String(saved.limit));
  // After htmx has set the page up (its ready handler runs first): a request started earlier
  // leaves its element marked as loading for good.
  document.addEventListener('DOMContentLoaded', reloadRows);
})();

document.body.addEventListener('htmx:afterSettle', function (evt) {
  if (!highlightId || evt.detail.elt.id !== 'download-rows') return;
  var row = document.querySelector('#download-rows tr[data-dl-id="' + CSS.escape(highlightId) + '"]');
  if (row) {
    row.classList.add('bc-highlight');
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightId = null;
  }
});
</script>
{% endblock %}
