{% extends "base.html" %}
{% block title %}BookClub — Logs{% endblock %}

{% block content %}
<div class="row g-4">
  <div class="col-12">
    <h4 class="page-title mb-4">
      <i class="bi bi-terminal me-2 text-accent"></i>
      Application Logs
    </h4>
  </div>

  <div class="col-12">
    <div class="bc-card">
      <div class="bc-card-header d-flex align-items-center justify-content-between flex-wrap gap-2">

        <!-- Level filter -->
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <span class="text-muted small me-1">Level:</span>
          {% for lvl in ["ALL","DEBUG","INFO","WARNING","ERROR"] %}
          <button
            class="btn btn-sm level-filter-btn {% if lvl == 'ALL' %}active-filter{% endif %}"
            data-level="{{ lvl }}"
            onclick="setLevelFilter('{{ lvl }}')"
          >{{ lvl }}</button>
          {% endfor %}
        </div>

        <div class="d-flex align-items-center gap-2 flex-wrap">
          <form id="log-controls" class="d-flex align-items-center gap-2" onsubmit="return false;">
            <input type="hidden" name="level" id="log-level" value="ALL" />
            <input type="text" name="search" id="log-search" class="form-control form-control-sm" style="width:170px;"
                   placeholder="Search text" oninput="logControlsChanged()" />
            <input type="text" name="download" id="log-download" class="form-control form-control-sm" style="width:110px;"
                   placeholder="Download #" oninput="logControlsChanged()" />
            <!-- Limit selector -->
            <span class="text-muted small">Max rows:</span>
            <select id="log-limit" name="limit" class="form-select form-select-sm" style="width:auto;" onchange="logControlsChanged()">
              <option value="50" selected>50</option>
              <option value="100">100</option>
              <option value="250">250</option>
              <option value="500">500</option>
              <option value="0">500 (most)</option>
            </select>
          </form>

          <!-- Clear button -->
          <button
            class="btn btn-sm"
            style="background:var(--danger-dim);border:1px solid rgba(240,71,71,0.3);color:var(--danger);"
            hx-delete="/logs"
            hx-target="#log-rows-wrap"
            hx-swap="innerHTML"
            hx-confirm="Clear all log entries?"
          >
            <i class="bi bi-trash3 me-1"></i>Clear All
          </button>
        </div>
      </div>

      <div class="bc-card-body p-0">
        <div class="table-responsive">
          <table class="table bc-table mb-0" style="font-size:0.8rem;">
            <thead>
              <tr>
                <th style="width:155px;">Time</th>
                <th style="width:90px;">Level</th>
                <th style="width:110px;">Source</th>
                <th>Message</th>
                <th style="width:80px;">Download</th>
              </tr>
            </thead>
            <tbody
              id="log-rows-wrap"
              data-bc-quiet
              hx-get="/logs/entries"
              hx-include="#log-controls"
              hx-trigger="bcLogs from:body, logsChanged, every 15s [bcShouldPoll()]"
              hx-swap="innerHTML"
            ></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
.level-filter-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 5px;
  padding: 0.2rem 0.6rem;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: background 0.15s, color 0.15s;
}
.level-filter-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
.level-filter-btn.active-filter { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
<script>
// The filters live in #log-controls, which every refresh includes, so the
// 15-second refresh keeps them. They are also remembered between visits.
var logTimer = null;
function logControlsChanged() {
  bcStore.set('logs', {
    level: document.getElementById('log-level').value,
    limit: document.getElementById('log-limit').value,
    search: document.getElementById('log-search').value
  });
  clearTimeout(logTimer);
  logTimer = setTimeout(function () { htmx.trigger('#log-rows-wrap', 'logsChanged'); }, 250);
}
function setLevelFilter(level) {
  document.getElementById('log-level').value = level;
  document.querySelectorAll('.level-filter-btn').forEach(function(btn) {
    btn.classList.toggle('active-filter', btn.dataset.level === level);
  });
  logControlsChanged();
}
// Keep expanded multi-line entries open when the list refreshes.
var openLogs = new Set();
document.body.addEventListener('htmx:beforeSwap', function (evt) {
  if (evt.detail.target.id !== 'log-rows-wrap') return;
  openLogs = new Set([...document.querySelectorAll('#log-rows-wrap details[open]')]
    .map(function (d) { return d.closest('tr').dataset.logId; }));
});
document.body.addEventListener('htmx:afterSettle', function (evt) {
  if (evt.detail.elt.id !== 'log-rows-wrap') return;
  openLogs.forEach(function (id) {
    var d = document.querySelector('#log-rows-wrap tr[data-log-id="' + id + '"] details');
    if (d) d.open = true;
  });
});

(function () {
  var saved = bcStore.get('logs', {}), url = new URLSearchParams(location.search);
  if (saved.limit) document.getElementById('log-limit').value = saved.limit;
  if (saved.search) document.getElementById('log-search').value = saved.search;
  // /logs?download=12 (from a download row) shows just that book.
  document.getElementById('log-download').value = url.get('download') || '';
  document.addEventListener('DOMContentLoaded', function () { setLevelFilter(saved.level || 'ALL'); });
})();
</script>
{% endblock %}
