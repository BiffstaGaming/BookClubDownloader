{% if matches %}
<div class="small text-muted mb-1"><i class="bi bi-clock-history me-1"></i>Seen before (no forum request needed):</div>
<div class="d-flex flex-wrap gap-1">
  {% for m in matches %}
  <button type="button" class="btn btn-sm bc-btn-outline text-start"
          hx-get="/search/topic/{{ m.topic_id }}" hx-target="#post-detail" hx-swap="innerHTML">
    {% if m.topic_id in revealed_ids %}<i class="bi bi-bookmark-star text-success me-1"></i>{% endif %}{{ m.title }}
  </button>
  {% endfor %}
</div>
{% endif %}
