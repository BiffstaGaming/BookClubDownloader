<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BookClub{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />

  <!-- Bootstrap 5 (dark-mode aware), Bootstrap Icons and htmx are served by BookClub itself (static/vendor) -->
  <link
    rel="stylesheet"
    href="/static/vendor/bootstrap/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <!-- Custom app styles -->
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}" />
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bc-navbar mb-4">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-book-half text-accent fs-4"></i>
        <span class="fw-bold">BookClub</span>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link" href="/">
              <i class="bi bi-search me-1"></i>Search
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/downloads">
              <i class="bi bi-download me-1"></i>Downloads
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/wishlist">
              <i class="bi bi-stars me-1"></i>Wishlist
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/library">
              <i class="bi bi-heart-pulse me-1"></i>Library
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/saved">
              <i class="bi bi-bookmark-star me-1"></i>Saved
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/logs">
              <i class="bi bi-terminal me-1"></i>Logs
            </a>
          </li>
          <li class="nav-item d-lg-none">
            <a class="nav-link" href="/m/phone">
              <i class="bi bi-phone me-1"></i>Phone view
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/settings">
              <i class="bi bi-gear me-1"></i>Settings
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Loading bar for requests you started (background refreshes don't show it) -->
  <div class="bc-loading-bar" id="global-indicator" style="display:none;">
    <div class="bc-loading-inner">
      <div class="spinner-border spinner-border-sm text-accent me-2" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span class="text-muted small">Loading&hellip;</span>
    </div>
  </div>

  <!-- Failed requests are reported here (see the script below) -->
  <div id="bc-errors" style="position:fixed;top:56px;right:16px;z-index:10000;max-width:460px;"></div>

  <!-- Main content -->
  <main class="container-fluid px-4 pb-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS bundle -->
  <script
    src="/static/vendor/bootstrap/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  ></script>
  <!-- HTMX -->
  <script src="/static/vendor/htmx/htmx.min.js" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"></script>
  <script src="/static/js/bookclub.js?v={{ asset_version }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
