<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BookClub{% endblock %}</title>

  <!-- Bootstrap 5 (dark-mode aware) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <!-- Custom app styles -->
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}" />
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bc-navbar mb-4">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-book-half text-accent fs-4"></i>
        <span class="fw-bold">BookClub</span>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link" href="/">
              <i class="bi bi-search me-1"></i>Search
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/downloads">
              <i class="bi bi-download me-1"></i>Downloads
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/saved">
              <i class="bi bi-bookmark-star me-1"></i>Saved
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/logs">
              <i class="bi bi-terminal me-1"></i>Logs
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/settings">
              <i class="bi bi-gear me-1"></i>Settings
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Loading bar for requests you started (background refreshes don't show it) -->
  <div class="bc-loading-bar" id="global-indicator" style="display:none;">
    <div class="bc-loading-inner">
      <div class="spinner-border spinner-border-sm text-accent me-2" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span class="text-muted small">Loading&hellip;</span>
    </div>
  </div>

  <!-- Main content -->
  <main class="container-fluid px-4 pb-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmxaJcQRkN4SJ3w3VqM/tGKqnrl"
    crossorigin="anonymous"
  ></script>
  <!-- HTMX -->
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.10/dist/htmx.min.js"></script>
  <script>
    (function () {
      // ── loading bar: counts requests, ignores background polling ([data-bc-quiet]) ──
      var inFlight = 0, bar = document.getElementById('global-indicator');
      function quiet(elt) { return elt && elt.closest && elt.closest('[data-bc-quiet]'); }
      document.body.addEventListener('htmx:beforeRequest', function (evt) {
        if (quiet(evt.detail.elt)) return;
        evt.detail.elt.__bcCounted = true;
        inFlight++;
        bar.style.display = 'flex';
      });
      document.body.addEventListener('htmx:afterRequest', function (evt) {
        if (!evt.detail.elt.__bcCounted) return;
        evt.detail.elt.__bcCounted = false;
        inFlight = Math.max(0, inFlight - 1);
        if (!inFlight) bar.style.display = 'none';
      });

      // ── alerts: success/info fade after a few seconds; every alert can be closed ──
      function tidyAlerts(root) {
        (root || document).querySelectorAll('.alert[data-autohide]:not([data-bc-timer])').forEach(function (el) {
          el.setAttribute('data-bc-timer', '1');
          setTimeout(function () {
            el.style.transition = 'opacity .4s';
            el.style.opacity = '0';
            setTimeout(function () {
              var panel = el.closest('[data-bc-clear-when-empty]');
              el.remove();
              if (panel && !panel.textContent.trim()) panel.innerHTML = '';
            }, 450);
          }, 6000);
        });
      }

      // ── times: <time class="bc-time" datetime="...Z"> shown in this browser's timezone ──
      var fmt = new Intl.DateTimeFormat(undefined, {
        year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      });
      function localTimes(root) {
        (root || document).querySelectorAll('time.bc-time:not([data-bc-done])').forEach(function (el) {
          var d = new Date(el.getAttribute('datetime'));
          if (!isNaN(d)) { el.textContent = fmt.format(d); el.title = d.toString(); }
          el.setAttribute('data-bc-done', '1');
        });
      }

      function refresh(root) { tidyAlerts(root); localTimes(root); }
      document.addEventListener('DOMContentLoaded', function () { refresh(); });
      document.body.addEventListener('htmx:afterSettle', function (evt) { refresh(evt.detail.elt); });
      refresh();

      // ── highlight the current page in the nav ──
      var path = location.pathname.replace(/\/$/, '') || '/';
      document.querySelectorAll('.navbar .nav-link').forEach(function (a) {
        var href = a.getAttribute('href');
        if (href === path || (href !== '/' && path.indexOf(href) === 0)) a.classList.add('active');
      });

      // Small persistence helpers used by the pages
      window.bcStore = {
        get: function (key, fallback) {
          try { var v = localStorage.getItem('bc:' + key); return v === null ? fallback : JSON.parse(v); }
          catch (e) { return fallback; }
        },
        set: function (key, value) { try { localStorage.setItem('bc:' + key, JSON.stringify(value)); } catch (e) {} },
        del: function (key) { try { localStorage.removeItem('bc:' + key); } catch (e) {} }
      };
    })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
