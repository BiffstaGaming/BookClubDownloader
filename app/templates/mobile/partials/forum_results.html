{% if cached_at %}
<div class="d-flex align-items-center gap-2 small text-muted mb-2">
  <i class="bi bi-lightning-charge"></i>
  <span class="flex-grow-1">Saved copy from {{ cached_at | localtime }}</span>
  <form hx-post="/search/forum" hx-target="#forum-results" hx-swap="innerHTML">
    <input type="hidden" name="query" value="{{ query }}" />
    <input type="hidden" name="refresh" value="1" />
    <button type="submit" class="btn btn-sm bc-btn-outline">
      <span class="spinner-border spinner-border-sm htmx-indicator me-1" role="status"></span>
      <i class="bi bi-arrow-clockwise me-1"></i>Refresh
    </button>
  </form>
</div>
{% endif %}
{% if results %}
<div class="m-section">{{ results | length }} topic{{ '' if results|length == 1 else 's' }}</div>
{% for result in results %}
<button type="button" class="m-card m-topic w-100 text-start" data-topic-id="{{ result.topic_id }}"
        hx-get="/search/topic/{{ result.topic_id }}" hx-target="#post-detail" hx-swap="innerHTML"
        onclick="mOpenTopic(this)" style="color:inherit;">
  <div class="d-flex align-items-center gap-2">
    <div class="flex-grow-1">
      <div class="m-card-title">{{ result.title }}</div>
      {% if revealed_ids and result.topic_id in revealed_ids %}
      <span class="badge bc-badge-success mt-1"><i class="bi bi-bookmark-star me-1"></i>Saved</span>
      {% endif %}
    </div>
    <i class="bi bi-chevron-right text-muted"></i>
  </div>
</button>
{% endfor %}
{% else %}
<div class="m-empty"><i class="bi bi-binoculars"></i>No posts found for <strong>{{ query }}</strong>.<br />Try fewer or different words.</div>
{% endif %}
